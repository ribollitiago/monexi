name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*' # Dispara automaticamente quando envia uma tag (ex: v0.1.0, v1.0.0)

permissions:
  contents: write # Permissão para criar a Release e anexar arquivos no repositório

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Permissão de execução para o gradlew
        run: chmod +x gradlew

      - name: Compilar APK de Release
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Organizar e Renomear o APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/monexi-${{ github.ref_name }}.apk

      - name: Criar GitHub Release e Anexar APK
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/monexi-${{ github.ref_name }}.apk
          name: Monexi ${{ github.ref_name }}
          body: |
            🚀 **Monexi ${{ github.ref_name }}**
            
            O APK oficial desta versão foi compilado automaticamente pelo GitHub Actions.
            
            ### 📥 Como instalar:
            1. Faça o download do arquivo `monexi-${{ github.ref_name }}.apk` na seção **Assets** abaixo.
            2. Abra o arquivo no seu celular Android para realizar a instalação.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
